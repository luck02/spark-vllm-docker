# Recipe: DeepSeek V4 Flash 0731 (DSpark), conservative bring-up profile
#
# 0731 replaced the single MTP draft layer with a 3-layer DSpark speculator
# (dspark_block_size=5, target layers 40-42, Markov head on stage 3). The old
# {"method":"mtp"} config still boots against it -- num_nextn_predict_layers:1
# is vestigially present in config.json -- but silently degrades (no MTP head
# in the weights). DSpark is the only correct speculative method here.
#
# Conservative by design; perf levers (async-scheduling, FULL cudagraphs,
# chunked prefill, probabilistic draft sampling, longer context / NVFP4 KV)
# are a later tuning pass:
#   - num_speculative_tokens=5: must be a multiple of dspark_block_size (5).
#     Model card says 7; on GB10 7 measured strictly worse (eugr PR #304) and
#     crashes some runtimes.
#   - draft_sample_method=greedy: probabilistic only wins with the Gumbel
#     PRs (vllm #47386/#47524), which releases/v0.26.0 does not carry.
#   - gpu_memory_utilization=0.78: 0.80 boots and passes smoke tests, then
#     dies under first real traffic -- DSpark allocates draft buffers on the
#     first request, not at boot (tonyd2wild).
#   - no --async-scheduling: races with spec decode on SM121 (eugr #194).
#   - never pass use_fp4_indexer_cache (hard-asserts off SM100) and never set
#     server-side repetition_penalty (illegal memory access with DSpark).
#
# Image requirement: vLLM >= 0.25 with DSpark (vllm #46995); we build
# releases/v0.26.0 -- nightly is broken for DSpark (#50615), 0.25.2 is a
# known perf regression.
recipe_version: "1"
name: DeepSeek-V4-Flash-0731-DSpark-T2
description: T2 tuning variant = full eugr PR #304 perf package (T1 flags + FULL_AND_PIECEWISE cudagraphs + profiler/allocator envs). T1 alone is NOT viable -- autotune workspace starves KV (5.5 GiB) without VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0; these flags only work as a package

model: deepseek-ai/DeepSeek-V4-Flash-0731

container: vllm-node

cluster_only: true

mods:
  - mods/fix-dspark-dsv4-d2t             # eugr PR #304: guard speculator against missing draft_id_to_target_id (vllm #47429)
  # SM12x DSpark needs both FlashInfer TOPK=256 halves; each mod no-ops once the
  # image's FlashInfer contains flashinfer #3817 (decode) / #3834 (prefill).
  - mods/add-dsv4-topk256
  - mods/add-dsv4-topk256-prefill
  - mods/fix-dspark-shared-experts-0731  # 0731 draft loader drops 12 shared-expert tensors; acceptance 26% -> 60%
  - mods/instanttensor-hybrid-draft-loader  # avoid a second InstantTensor pass for the same-checkpoint draft

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.78
  max_model_len: 262144
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  num_speculative_tokens: 5

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"   # spec-decode sampling hygiene (cold-start garble fix)
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"   # don't reserve FULL-cudagraph memory in the profiler -- KV gets the budget, capture uses on-top headroom (PR #304)
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"   # reduce unified-memory fragmentation

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-flashinfer-autotune \
      --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --max-cudagraph-capture-size {max_num_seqs} \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}}' \
      --generation-config vllm \
      --tokenizer-mode deepseek_v4 \
      --distributed-executor-backend ray \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor
