# Recipe: DeepSeek V4 Flash Vision Exp
# From eugr upstream recipes/deepseek-v4-flash-vision-exp.yaml (2026-09-08), with two
# local changes:
#  - container: vllm-node-b12x-vision, NOT vllm-node-b12x. Vision support is vLLM
#    PR #54566, merged to main 2026-09-02. Our vllm-node-b12x was built 2026-08-05
#    and has no vision code in vllm/models/deepseek_v4 at all, and run-recipe.sh
#    only builds an image when it is missing - so the upstream name would have run
#    the model text-only. vllm-node-b12x-vision is eugr/spark-vllm-b12x:nightly-20260913
#    pulled and retagged 2026-09-15. The Aug-5 image stays put for rollback to 0731.
#  - --enable-prompt-tokens-details, so the routing log records cache hits
#    (docs/decisions.md 2026-09-15 in ai_monitor_control).
# DeepSeek V4 Flash with Vision support using the B12X-optimized serving stack on an SM121 cluster

recipe_version: "1"
name: DeepSeek-V4-Flash-Vision-Exp
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-Vision-Exp on a dual Sparks using B12X docker

model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
container: vllm-node-b12x-vision

build_args:
  - --exp-b12x

cluster_only: true

mods: 
  - mods/instanttensor-hybrid-draft-loader
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  # 262144, not auto. Vision-Exp weights take 81.2 GiB per node, which leaves
  # 7.31 GiB for KV at util 0.85. On `auto` vLLM shrinks max_model_len to fit
  # (293,888 on 2026-09-16) and then fails capturing CUDA graphs:
  # "assert active_topk_width >= cm.max_seq_len // self.compress_ratio"
  # (vllm/models/deepseek_v4/sparse_mla.py:262). The C128A topk buffers get
  # sized from the shrunken length while the capture still uses the pre-shrink
  # 1M, so the engine never starts. A pinned length that fits skips auto-fit.
  max_model_len: 262144
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 48
  num_speculative_tokens: 6

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-prompt-tokens-details \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X"}}'
