# Recipe: GLM-5.3-Flash-NVFP4-Spark
# GLM 5.3 Flash using the B12X-optimized serving stack on a dual DGX Spark cluster
# Local change: --enable-prompt-tokens-details, so usage.prompt_tokens_details
# records cache hits (ai_monitor_control docs/decisions.md 2026-09-15). The flag
# only takes effect at model start.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4-Spark
description: vLLM serving local-inference-lab/GLM-5.3-Flash-NVFP4-Spark on a dual DGX Spark cluster

model: local-inference-lab/GLM-5.3-Flash-NVFP4-Spark
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  decode_context_parallel: 1
  block_size: 256
  # 131072, not upstream's 500000. The attention workspace scales with this,
  # and the profiled activation peak is what leaves no room for KV.
  max_model_len: 131072
  max_num_seqs: 4
  # 2048, not 4096: the OOM kill at util 0.85 happened on the first prompt
  # with a ~2000-token prefill, and this caps the per-step prefill spike.
  max_num_batched_tokens: 2048
  num_speculative_tokens: 5
  # Defined by upstream but deliberately NOT passed. --kv-cache-memory-bytes
  # makes vLLM skip memory profiling altogether -- it logs "does not respect
  # the gpu_memory_utilization config" -- so nothing bounds total use and the
  # Linux OOM killer took the worker during KV allocation (2026-09-22).
  # On unified memory the budget has to come from util, not from this.
  kv_cache_memory_bytes: 8G
  # 0.85, not upstream's 0.87. vLLM checks free memory at startup and our
  # nodes read 104.49 of 121.63 GiB free with caches dropped, so 0.87 (105.81
  # GiB) aborts before any weight loads. Measured ceiling is ~0.859
  # (ai_monitor_control docs/decisions.md 2026-08-06). Costs nothing here:
  # weights are ~77 GiB per node, so 0.85 still leaves ~26 GiB for KV, well
  # over the 8 GiB upstream was targeting.
  gpu_memory_utilization: 0.84

env:
  # The NAS downloader (ai_monitor_control nas/hf-downloader/download.sh) sets
  # HF_HOME, so models land in the hub/ subdirectory. The Sparks symlink
  # ~/.cache/huggingface/hub at /mnt/nas/models/huggingface, one level above
  # that, so HF does not find this model and silently starts pulling all 166 GB
  # from the internet instead (seen 2026-09-22: 12 GB of stalled XET blobs).
  # Point the cache at the layout the file actually uses, and refuse to reach
  # the network at all so a miss fails fast instead of downloading.
  HF_HUB_CACHE: "/mnt/nas/models/huggingface/hub"
  # NCCL cannot register memory on these HCAs: ibv_reg_mr_iova2 returns
  # ENOMEM and NCCL reports "unhandled system error", intermittently, during
  # the very first communicator. It is not the channel count (16 fails the
  # same as 64), not the memlock limit (unlimited fails the same as 8 MB),
  # not dmabuf (NCCL_DMABUF_ENABLE=0 fails the same), and nvidia_peermem
  # will not insert on GB10 at all. Sockets over the same CX-7 link work.
  # b12x RoCEnante still does the hot TP all-reduce over RDMA, so this only
  # moves NCCL's own traffic. Remove once the registration path is fixed.
  NCCL_IB_DISABLE: "1"
  HF_HUB_OFFLINE: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

command: |
  vllm serve local-inference-lab/GLM-5.3-Flash-NVFP4-Spark \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-prompt-tokens-details \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --gpu-memory-utilization {gpu_memory_utilization}
