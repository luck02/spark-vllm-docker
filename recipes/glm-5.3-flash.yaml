# Recipe: GLM-5.3-Flash-NVFP4-Spark
# GLM 5.3 Flash using the B12X-optimized serving stack on a dual DGX Spark cluster

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4-Spark
description: vLLM serving local-inference-lab/GLM-5.3-Flash-NVFP4-Spark on a dual DGX Spark cluster

model: local-inference-lab/GLM-5.3-Flash-NVFP4-Spark
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  decode_context_parallel: 1
  block_size: 256
  # Local changes from upstream (2026-09-25), which ships 500000 / 0.87 and
  # leaves kv_cache_memory_bytes out of the command:
  # - 0.87 fails vLLM's startup free-memory check on our Sparks. It needs
  #   105.81 GiB free and the best we have seen is 105.17, right after a
  #   reboot. 0.85 passes (needs 103.38).
  # - At 0.85 with 4096 batched tokens, the automatic KV cache is 4.32 GiB,
  #   too small for 500000. So the cache is fixed at 4.8 GiB (5153960755
  #   bytes) and max_model_len is 262144: 422,484 tokens of cache, 1.61 full
  #   262144-token requests at once. With the cache fixed,
  #   gpu_memory_utilization only sets the bar for the startup check.
  # - About 3.3 GiB stays free on spark1 once serving. A larger cache risks
  #   the out-of-memory kill seen during b12x warm-up at 0.855.
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  num_speculative_tokens: 5
  kv_cache_memory_bytes: 5153960755
  gpu_memory_utilization: 0.85

env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"
  B12X_POLICY_MODE: "auto"
  INSTANTTENSOR_BACKEND: "BUFFERED"
  INSTANTTENSOR_BUFFER_SIZE: "67108864"
  INSTANTTENSOR_CHUNK_SIZE: "8388608"
  INSTANTTENSOR_CONCURRENCY: "1"
  INSTANTTENSOR_IO_DEPTH: "3"

command: |
  vllm serve local-inference-lab/GLM-5.3-Flash-NVFP4-Spark \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --decode-context-parallel-size {decode_context_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --attention-backend B12X \
    --block-size {block_size} \
    --moe-backend b12x \
    --linear-backend b12x \
    --no-enable-flashinfer-autotune \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"moe_backend":"humming","attention_backend":"B12X"}}' \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization}
