recipe_version: '1'
name: MiniMax-M2.7-AWQ
description: vLLM serving MiniMax-M2.7-AWQ with Ray distributed backend
model: cyankiwi/MiniMax-M2.7-AWQ-4bit
container: vllm-node
cluster_only: true
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.78
  max_model_len: 196608
env:
  SAFETENSORS_FAST_GPU: '1'
command: "vllm serve cyankiwi/MiniMax-M2.7-AWQ-4bit \\\n    --trust-remote-code \\\n    --port {port} \\\n    --host {host} \\\n    --gpu-memory-utilization {gpu_memory_utilization} \\\n    -tp {tensor_parallel}\
  \ \\\n    --distributed-executor-backend ray \\\n    --max-model-len {max_model_len} \\\n    --load-format fastsafetensors \\\n    --max-num-seqs 16 \\\n    --max-num-batched-tokens 16384 \\\n    --enable-prefix-caching\
  \ \\\n    --prefix-caching-hash-algo sha256_cbor \\\n    --kv-cache-dtype fp8 \\\n    --enable-auto-tool-choice \\\n    --tool-call-parser minimax_m2 \\\n    --reasoning-parser minimax_m2_append_think\
  \ \\\n      --attention-backend FLASHINFER\n"
